    <title>Recipe App</title>

    <link rel="stylesheet" href="sty.css">
</head>
<body>

    <h1 style="text-align: center;"> Recipe App</h1>

    <div style="display: flex; justify-content: center;align-items: center;gap: 20px;" class="menu">

    <div id="cards"></div>

    <div id="modal" class="modal">

        <div style="display: flex; justify-content: center;" class="modal-content">

            <p id="mealCategory"></p>

            <p id="mealArea"></p>
